# ─────────────────────────────────────────────────────────────────────────────
# HC-1 UI Service – nginx reverse proxy
#
# Topology:
#   browser → nginx:8080
#     /            → static HTML/JS
#     /analyze     → orchestrator:8003/analyze
#     /health      → orchestrator:8003/health
#     /pipeline    → orchestrator:8003/pipeline
#     /sys/health  → orchestrator:8003/sys/health
# ─────────────────────────────────────────────────────────────────────────────

upstream orchestrator_upstream {
    server orchestrator:8003;
    keepalive 4;
}

# ── gzip ──────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/html
    text/css
    text/plain
    text/javascript
    application/json
    application/javascript
    image/svg+xml;

server {
    listen 8080;
    server_name _;

    # ── security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "same-origin"   always;

    # ── static UI ─────────────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # ── nginx own health (Docker health-check target) ─────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── proxy: orchestrator API endpoints ────────────────────────────────────
    location ~ ^/(analyze|health|pipeline|sys)(/.*)?$ {
        proxy_pass         http://orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # LLM calls can take up to 3 minutes
        proxy_connect_timeout  5s;
        proxy_send_timeout     190s;
        proxy_read_timeout     190s;

        # Don't buffer streaming-friendly responses
        proxy_buffering        off;
        proxy_request_buffering off;
    }

    # ── Vite hashed bundles: content-addressed, safe to cache forever ────────
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── SPA fallback (all other static assets) ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── error pages when orchestrator is down ────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error":"Pipeline services unavailable. Check docker-compose logs."}';
        add_header Content-Type application/json;
    }
}
