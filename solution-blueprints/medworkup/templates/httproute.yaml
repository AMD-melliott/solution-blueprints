{{- if .Values.http_route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "medworkup.fullname" . }}-ui
  labels:
    {{- include "medworkup.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.http_route.gateway.name }}
      namespace: {{ .Values.http_route.gateway.namespace }}
  {{- if .Values.http_route.hostname }}
  hostnames:
    - {{ .Values.http_route.hostname }}
  {{- end }}
  rules:
    - matches:
        {{- if .Values.http_route.hostname }}
        - path:
            type: PathPrefix
            value: /
        {{- else }}
        - headers:
            - name: Host
              type: RegularExpression
              # Matches "<release>-<chart>-ui." followed by any characters, so this
              # route only claims its own subdomain instead of every Host on the gateway.
              value: {{ include "medworkup.fullname" . }}-ui\..*
          path:
            type: PathPrefix
            value: /
        {{- end }}
      backendRefs:
        - name: {{ include "medworkup.fullname" . }}-ui
          port: {{ .Values.ports.ui }}
      timeouts:
        backendRequest: 3600s
        request: 3605s
{{- end }}
