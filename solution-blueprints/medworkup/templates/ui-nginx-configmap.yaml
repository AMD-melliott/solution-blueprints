apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medworkup.fullname" . }}-ui-nginx
  labels:
    {{- include "medworkup.labels" . | nindent 4 }}
data:
  hc1.conf: |
    upstream orchestrator_upstream {
        server {{ include "medworkup.fullname" . }}-orchestrator:{{ .Values.ports.orchestrator }};
        keepalive 4;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/json
        application/javascript
        image/svg+xml;

    server {
        listen {{ .Values.ports.ui }};
        server_name _;

        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "same-origin"   always;

        root  /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-store";
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location ~ ^/(analyze|health|pipeline|sys)(/.*)?$ {
            proxy_pass         http://orchestrator_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout  5s;
            proxy_send_timeout     190s;
            proxy_read_timeout     190s;

            proxy_buffering        off;
            proxy_request_buffering off;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600";
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error":"Pipeline services unavailable."}';
            add_header Content-Type application/json;
        }
    }
