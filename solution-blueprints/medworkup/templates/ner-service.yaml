apiVersion: v1
kind: Service
metadata:
  name: {{ include "medworkup.fullname" . }}-ner
  labels:
    {{- include "medworkup.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ports.ner }}
      targetPort: {{ .Values.ports.ner }}
  selector:
    app: {{ include "medworkup.fullname" . }}-ner
