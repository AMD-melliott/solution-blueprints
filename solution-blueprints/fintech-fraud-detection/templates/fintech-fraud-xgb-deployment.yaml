apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fintech.complexName" . }}-xgb
  labels:
    {{- include "fintech.labels" . | nindent 4 }}
    app: {{ include "fintech.complexName" . }}-xgb
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fintech.complexName" . }}-xgb
  template:
    metadata:
      labels:
        app: {{ include "fintech.complexName" . }}-xgb
    spec:
      {{- include "fintech.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: download-artifacts
          image: {{ .Values.artifacts.initImage }}
          command:
            - sh
            - -c
            - |
              pip install -q huggingface_hub && \
              [ -f /app/artifacts/.download_complete ] || \
              (hf download {{ .Values.artifacts.xgb.hfRepo }} --local-dir /app/artifacts && \
              touch /app/artifacts/.download_complete)
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfSecret.name }}
                  key: {{ .Values.hfSecret.key }}
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
      containers:
        - name: xgb
          image: "{{ .Values.images.xgb.repository }}:{{ tpl .Values.images.xgb.tag . }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.xgb }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.ports.xgb | quote }}
            {{- range $key, $value := .Values.env_vars.xgb }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.xgb | nindent 12 }}
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.xgb }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.xgb }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "fintech.complexName" . }}-xgb-artifacts
