apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fintech.complexName" . }}-middleware-data
  labels:
    {{- include "fintech.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.artifacts.transactions.storageSize }}
