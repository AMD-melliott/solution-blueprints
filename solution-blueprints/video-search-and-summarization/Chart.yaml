apiVersion: v2
name: aimsb-video-search-and-summarization
description: Search and summarize archived video with grounded, cited Q&A, plus object detection and tracking, on AMD Instinct GPUs
type: application
version: 0.1.0

maintainers:
- name: AMD
  url: https://www.amd.com/

dependencies:
- name: aimchart-llm
  version: 0.2.6
  repository: oci://registry-1.docker.io/amdenterpriseai
  alias: llm
- name: aimchart-chromadb
  version: 0.1.4
  repository: oci://registry-1.docker.io/amdenterpriseai
  alias: chromadb
- name: aimchart-embedding
  version: 0.3.0
  repository: oci://registry-1.docker.io/amdenterpriseai
  alias: embedText
- name: aimchart-embedding
  version: 0.3.0
  repository: oci://registry-1.docker.io/amdenterpriseai
  alias: embedImage

annotations:
  org.opencontainers.image.vendor: AMD
  com.amd.aim.description.full: "Search and summarize large archives of recorded video. A vision-language model captions video segments, BGE-M3 text and CLIP image embeddings power hybrid retrieval in a vector database (ChromaDB), and an LLM produces recursive summaries and grounded, timestamp-cited answers across the archive. Includes object detection and multi-object tracking with boxes and IDs burned onto a tracking-overlay video."
  com.amd.aim.description.short: "Search and summarize archived video with grounded, timestamp-cited Q&A, hybrid retrieval, and object detection and tracking."
  com.amd.aim.hfToken.required: "not-applicable"
  com.amd.aim.title: "Video Search and Summarization"
