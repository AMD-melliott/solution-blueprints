#
# Local/dev runner for this blueprint. It builds and runs the SAME source (src/) and
# component images (components/) that the Helm chart ships, so we test what we deliver.
# It is excluded from the Helm package via .helmignore.
#
# Bring up:  docker compose up -d --build
# UI:        http://<host>:8090
name: vss

services:
  chromadb:
    image: chromadb/chroma:1.3.5
    container_name: vss-chromadb
    network_mode: host
    volumes:
      - ./data/chroma-server:/data
    restart: unless-stopped

  vllm-vlm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:v0.22.0}
    container_name: vss-vlm
    devices: [/dev/kfd, /dev/dri]
    group_add: [video]
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ipc: host
    shm_size: "16g"
    ports:
      - "${VLM_PORT:-30082}:8000"
    environment:
      HIP_VISIBLE_DEVICES: "${VLM_GPU:-0}"
      VLLM_USE_TRITON_FLASH_ATTN: "0"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
    command: >
      --model ${VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      --served-model-name ${VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      --max-model-len 32768 --gpu-memory-utilization 0.85
    restart: unless-stopped

  # LLM served as an AMD Inference Microservice (default), matching aimchart-llm.
  aim-llm:
    image: ${AIM_LLM_IMAGE:-amdenterpriseai/aim-qwen-qwen3-32b:0.11.0}
    container_name: vss-llm
    devices: [/dev/kfd, /dev/dri]
    group_add: [video]
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ipc: host
    shm_size: "16g"
    ports:
      - "${LLM_PORT:-30081}:8000"
    environment:
      HIP_VISIBLE_DEVICES: "${LLM_GPU:-1}"
      AIM_GPU_MODEL: "${AIM_GPU_MODEL:-MI355X}"
      AIM_GPU_COUNT: "1"
      AIM_PRECISION: "${AIM_PRECISION:-fp16}"
      AIM_ENGINE_ARGS: "${AIM_ENGINE_ARGS:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped

  # Self-hosted vLLM LLM alternative. To use instead of aim-llm, stop aim-llm first:
  #   docker compose stop aim-llm && COMPOSE_PROFILES=llm-vllm docker compose up -d vllm-llm
  vllm-llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:v0.22.0}
    container_name: vss-llm
    profiles: ["llm-vllm"]
    devices: [/dev/kfd, /dev/dri]
    group_add: [video]
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ipc: host
    shm_size: "16g"
    ports:
      - "${LLM_PORT:-30081}:8000"
    environment:
      HIP_VISIBLE_DEVICES: "${LLM_GPU:-1}"
      VLLM_USE_TRITON_FLASH_ATTN: "0"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen3-32B}
      --served-model-name ${LLM_MODEL:-Qwen/Qwen3-32B}
      --max-model-len 32768 --gpu-memory-utilization 0.90
    restart: unless-stopped

  # Embedders use the same vLLM image and serving mode as the aimchart-embedding subchart, so
  # the dev stack matches what the Helm chart deploys: an OpenAI-compatible /v1/embeddings API.
  # BGE-M3 handles caption text; CLIP handles keyframe images (chat-style) and text queries.
  embed-text:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:v0.22.0}
    container_name: vss-embed-text
    network_mode: host
    devices: [/dev/kfd, /dev/dri]
    group_add: [video]
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ipc: host
    shm_size: "8g"
    environment:
      HIP_VISIBLE_DEVICES: "${EMBED_TEXT_GPU:-3}"
      HF_TOKEN: "${HF_TOKEN:-}"
    command: ["${EMBED_TEXT_MODEL:-BAAI/bge-m3}", "--runner", "pooling", "--port", "8100"]
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped

  embed-image:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:v0.22.0}
    container_name: vss-embed-image
    network_mode: host
    devices: [/dev/kfd, /dev/dri]
    group_add: [video]
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ipc: host
    shm_size: "8g"
    environment:
      HIP_VISIBLE_DEVICES: "${EMBED_IMAGE_GPU:-4}"
      HF_TOKEN: "${HF_TOKEN:-}"
    command: ["${EMBED_IMAGE_MODEL:-openai/clip-vit-base-patch32}", "--runner", "pooling", "--port", "8101"]
    volumes:
      - ${HF_CACHE:-/root/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped

  track:
    build:
      context: ./components/track
    image: avb-track:local
    container_name: vss-track
    network_mode: host
    devices: [/dev/kfd, /dev/dri]
    group_add: [video]
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ipc: host
    shm_size: "8g"
    environment:
      HIP_VISIBLE_DEVICES: "${TRACK_GPU:-2}"
      TRACK_MODEL: "${TRACK_MODEL:-yolo11l.pt}"
    restart: unless-stopped

  # The app runs the delivered src/ on a stock Python image with the same steps the chart
  # entrypoint uses (install ffmpeg + requirements, run uvicorn).
  app:
    image: python:3.12
    container_name: vss-app
    network_mode: host
    working_dir: /app/src
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
        pip install --no-cache-dir -r /app/src/requirements.txt
        mkdir -p /data
        uvicorn app:app --host 0.0.0.0 --port 8090
    environment:
      VLM_BASE_URL: "http://127.0.0.1:${VLM_PORT:-30082}/v1"
      VLM_MODEL: "${VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}"
      LLM_BASE_URL: "http://127.0.0.1:${LLM_PORT:-30081}/v1"
      LLM_MODEL: "${LLM_MODEL:-Qwen/Qwen3-32B}"
      OPENAI_API_KEY: "EMPTY"
      EMBED_TEXT_URL: "http://127.0.0.1:8100"
      EMBED_TEXT_MODEL: "${EMBED_TEXT_MODEL:-BAAI/bge-m3}"
      EMBED_IMAGE_URL: "http://127.0.0.1:8101"
      EMBED_IMAGE_MODEL: "${EMBED_IMAGE_MODEL:-openai/clip-vit-base-patch32}"
      TRACK_URL: "http://127.0.0.1:8102"
      CHROMA_URL: "http://127.0.0.1:8000"
      UI_DIR: "/app/src/ui"
      DATA_DIR: "/data"
    volumes:
      - ./src:/app/src:ro
      - ./data:/data
    depends_on:
      - chromadb
      - embed-text
      - embed-image
      - track
    restart: unless-stopped
